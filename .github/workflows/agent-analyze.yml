name: agent · analyser

# Appelant de la boucle d'agents. Le workflow réel vit dans
# `sassy-solutions/Nexus/.github/workflows/agent-analyze.yml` ; ici on ne fait que
# l'appeler avec l'écosystème et les profils de permissions de CE dépôt.
# Référence : `docs/operations/boucle-agents.md` §4 dans Nexus.

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Identifiant du ticket"
        required: true
      model:
        description: "Modèle"
        required: false
        default: opus
  repository_dispatch:
    types: [agent-analyze]

jobs:
  analyser:
    uses: sassy-solutions/Nexus/.github/workflows/agent-analyze.yml@main
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
    with:
      runner: dotnet
      ecosysteme: dotnet
      task: ${{ inputs.task || github.event.client_payload.task }}
      model: ${{ inputs.model || github.event.client_payload.model }}
    secrets: inherit
